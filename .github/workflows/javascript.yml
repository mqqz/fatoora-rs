name: javascript
on:
  pull_request:
    # Include shared build inputs and the cross-package release metadata check.
    paths:
      - '.github/workflows/javascript.yml'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'bindings/python/pyproject.toml'
      - 'bindings/python/uv.lock'
      - 'bindings/js/package.json'
      - 'bindings/js/package-lock.json'
      - 'bindings/dotnet/Fatoora.csproj'
      - 'bindings/kotlin/build.gradle.kts'
      - 'scripts/check_release.py'
      - '.cargo/**'
      - 'rust-toolchain*'
      - 'fatoora-core/**'
      - 'fatoora-derive/**'
      - 'fatoora-ffi/**'
      - 'LICENSE-*'
      - 'THIRD_PARTY_NOTICES.md'
      - 'scripts/generate_*.py'
      - 'scripts/install_*_generator.py'
      - 'scripts/patches/**'
      - 'scripts/c_facade_runtime.c'
      - 'scripts/js-wasm.mjs'
      - 'bindings/c/fatoora.*'
      - 'bindings/c/generated/**'
      - 'bindings/cpp/**'
      - 'bindings/python/native/generated/**'
      - 'bindings/js/generated/**'
      - 'bindings/dotnet/generated/**'
      - 'bindings/kotlin/generated/**'
      - 'bindings/js/**'
      - 'scripts/build_js.py'
      - 'scripts/check_js_package.py'
      - 'scripts/check_wasm_size.py'
  push:
    # Include shared build inputs and the cross-package release metadata check.
    paths:
      - '.github/workflows/javascript.yml'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'bindings/python/pyproject.toml'
      - 'bindings/python/uv.lock'
      - 'bindings/js/package.json'
      - 'bindings/js/package-lock.json'
      - 'bindings/dotnet/Fatoora.csproj'
      - 'bindings/kotlin/build.gradle.kts'
      - 'scripts/check_release.py'
      - '.cargo/**'
      - 'rust-toolchain*'
      - 'fatoora-core/**'
      - 'fatoora-derive/**'
      - 'fatoora-ffi/**'
      - 'LICENSE-*'
      - 'THIRD_PARTY_NOTICES.md'
      - 'scripts/generate_*.py'
      - 'scripts/install_*_generator.py'
      - 'scripts/patches/**'
      - 'scripts/c_facade_runtime.c'
      - 'scripts/js-wasm.mjs'
      - 'bindings/c/fatoora.*'
      - 'bindings/c/generated/**'
      - 'bindings/cpp/**'
      - 'bindings/python/native/generated/**'
      - 'bindings/js/generated/**'
      - 'bindings/dotnet/generated/**'
      - 'bindings/kotlin/generated/**'
      - 'bindings/js/**'
      - 'scripts/build_js.py'
      - 'scripts/check_js_package.py'
      - 'scripts/check_wasm_size.py'
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish package to npm (select a version tag)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check release metadata
        run: python3 scripts/check_release.py
      - name: Check publication tag
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$RELEASE_REF_TYPE" = tag
          python3 scripts/check_release.py --tag "$RELEASE_TAG"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bindings/js/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix bindings/js
      - run: cargo install diplomat-tool --version 0.16.1 --locked
      - uses: actions/cache@v4
        id: diplomat-fork
        with:
          path: .tools/diplomat-fork
          key: diplomat-fork-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install_dotnet_generator.py') }}
      - if: steps.diplomat-fork.outputs.cache-hit != 'true'
        run: python3 scripts/install_dotnet_generator.py
      - uses: actions/cache@v4
        id: diplomat-kotlin
        with:
          path: .tools/diplomat-kotlin
          key: diplomat-kotlin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install_kotlin_generator.py', 'scripts/patches/diplomat-kotlin.patch') }}
      - if: steps.diplomat-kotlin.outputs.cache-hit != 'true'
        run: python3 scripts/install_kotlin_generator.py
      - run: python3 scripts/generate_bindings.py --check
      - run: python3 scripts/build_js.py
      - run: python3 scripts/check_wasm_size.py --json
      - run: npm run check --prefix bindings/js
      - run: node bindings/js/tests/runtime.test.mjs
      - run: npx --prefix bindings/js playwright install --with-deps chromium
      - run: node bindings/js/tests/browser.mjs
      - run: python3 scripts/check_js_package.py --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: npm-dist
          path: dist/fatoority-*.tgz
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: wasm
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    concurrency:
      group: npm-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Publish tested package to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./dist/fatoority-*.tgz --access public --ignore-scripts
