name: rust

on:
  pull_request:
    # Include shared build inputs and the cross-package release metadata check.
    paths:
      - '.github/workflows/rust.yml'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'bindings/python/pyproject.toml'
      - 'bindings/python/uv.lock'
      - 'bindings/js/package.json'
      - 'bindings/js/package-lock.json'
      - 'bindings/dotnet/Fatoora.csproj'
      - 'bindings/kotlin/build.gradle.kts'
      - 'scripts/check_release.py'
      - '.cargo/**'
      - 'rust-toolchain*'
      - 'fatoora-core/**'
      - 'fatoora-derive/**'
      - 'fatoora-ffi/**'
      - 'LICENSE-*'
      - 'THIRD_PARTY_NOTICES.md'
      - 'fatoora-cli/**'
      - 'bindings/c/**'
      - 'bindings/cpp/**'
      - 'bindings/python/native/generated/**'
      - 'bindings/js/generated/**'
      - 'bindings/dotnet/generated/**'
      - 'bindings/kotlin/generated/**'
      - 'scripts/**'
      - 'bench/dotnet/**'
      - 'README.md'
      - 'rustfmt.toml'
      - '.rustfmt.toml'
      - 'clippy.toml'
      - '.clippy.toml'
      - 'codecov.yml'
      - '.codecov.yml'
    branches: ["**"]
  push:
    # Include shared build inputs and the cross-package release metadata check.
    paths:
      - '.github/workflows/rust.yml'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'bindings/python/pyproject.toml'
      - 'bindings/python/uv.lock'
      - 'bindings/js/package.json'
      - 'bindings/js/package-lock.json'
      - 'bindings/dotnet/Fatoora.csproj'
      - 'bindings/kotlin/build.gradle.kts'
      - 'scripts/check_release.py'
      - '.cargo/**'
      - 'rust-toolchain*'
      - 'fatoora-core/**'
      - 'fatoora-derive/**'
      - 'fatoora-ffi/**'
      - 'LICENSE-*'
      - 'THIRD_PARTY_NOTICES.md'
      - 'fatoora-cli/**'
      - 'bindings/c/**'
      - 'bindings/cpp/**'
      - 'bindings/python/native/generated/**'
      - 'bindings/js/generated/**'
      - 'bindings/dotnet/generated/**'
      - 'bindings/kotlin/generated/**'
      - 'scripts/**'
      - 'bench/dotnet/**'
      - 'README.md'
      - 'rustfmt.toml'
      - '.rustfmt.toml'
      - 'clippy.toml'
      - '.clippy.toml'
      - 'codecov.yml'
      - '.codecov.yml'
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish crates to crates.io"
        required: false
        default: "false"
jobs:
  fresh-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup update stable
      - name: Build consumer with freshly resolved dependencies
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fresh-consumer-target
        run: |
          consumer=$(mktemp -d "$RUNNER_TEMP/fatoora-consumer.XXXXXX")
          mkdir -p "$consumer/src"
          # An external workspace cannot inherit the repository's Cargo.lock.
          # Use this checkout so the check also covers unreleased changes.
          cat > "$consumer/Cargo.toml" <<EOF
          [package]
          name = "fatoora-fresh-consumer"
          version = "0.0.0"
          edition = "2024"
          publish = false

          [workspace]

          [dependencies]
          fatoora-core = { path = "$GITHUB_WORKSPACE/fatoora-core" }
          EOF
          echo 'pub use fatoora_core::*;' > "$consumer/src/lib.rs"
          cargo build --manifest-path "$consumer/Cargo.toml"

  coverage:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      SKIP_ZATCA_LIVE_API: "1"
      PROPTEST_CASES: "256"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test native artifact import checks
        run: python3 scripts/test_xml_free_artifacts.py
      - name: Check release metadata
        run: python3 scripts/check_release.py
      - name: Check publication tag
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$RELEASE_REF_TYPE" = tag
          python3 scripts/check_release.py --tag "$RELEASE_TAG"
      - name: Install Rust
        run: |
          rustup update stable
          rustup component add clippy rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test XSD compatibility probe
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo test --locked --manifest-path scripts/xsd-compat/Cargo.toml
      - uses: actions/cache@v4
        id: diplomat-fork
        with:
          path: .tools/diplomat-fork
          key: diplomat-fork-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install_dotnet_generator.py') }}
      - if: steps.diplomat-fork.outputs.cache-hit != 'true'
        run: python3 scripts/install_dotnet_generator.py
      - uses: actions/cache@v4
        id: diplomat-kotlin
        with:
          path: .tools/diplomat-kotlin
          key: diplomat-kotlin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install_kotlin_generator.py', 'scripts/patches/diplomat-kotlin.patch') }}
      - if: steps.diplomat-kotlin.outputs.cache-hit != 'true'
        run: python3 scripts/install_kotlin_generator.py
      - name: Check generated bindings and native contracts
        run: |
          cargo install diplomat-tool --version 0.16.1 --locked
          python3 scripts/generate_bindings.py --check
          python3 scripts/check_native_bindings.py
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Test release checks and SDK capture harness
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Check business-rule inventory and reference evidence
        run: |
          python3 scripts/business_rules.py check
          python3 scripts/integrity_validation.py check
      - name: Generate code coverage without the SDK
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/no-sdk"
          cat > "$RUNNER_TEMP/no-sdk/java" <<'EOF'
          #!/bin/sh
          touch "$SDK_JAVA_PROBE"
          exit 99
          EOF
          chmod +x "$RUNNER_TEMP/no-sdk/java"
          export SDK_JAVA_PROBE="$RUNNER_TEMP/no-sdk/invoked"
          env -u FATOORA_HOME -u SDK_CONFIG -u ZATCA_SDK_ROOT \
            PATH="$RUNNER_TEMP/no-sdk:$PATH" \
            cargo llvm-cov --locked --all-features --workspace --lcov --output-path lcov.info -- --skip doc_example_api
          test ! -e "$SDK_JAVA_PROBE"
      - name: Preserve property-test failure seeds
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: property-test-regressions
          path: |
            fatoora-core/proptest-regressions/**/*.txt
            fatoora-core/tests/*.proptest-regressions
          if-no-files-found: ignore
      - name: Verify packages without publishing
        run: cargo publish --workspace --locked --dry-run
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: github.repository == 'mqqz/fatoority'
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # required for private repos or protected branches
          files: lcov.info
          fail_ci_if_error: true

  publish:
    runs-on: ubuntu-latest
    needs: [coverage, fresh-consumer]
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup update stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p fatoora-derive --locked
          cargo publish -p fatoora-core --locked
          cargo publish -p fatoora-ffi --locked
          cargo publish -p fatoora-cli --locked
