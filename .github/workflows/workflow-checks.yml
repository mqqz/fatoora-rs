name: workflow-checks
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/tests/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/tests/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s .github/tests -v
