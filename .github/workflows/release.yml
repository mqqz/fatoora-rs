name: release

on:
  pull_request:
    # Include shared build inputs and the cross-package release metadata check.
    paths:
      - '.github/workflows/release.yml'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'bindings/python/pyproject.toml'
      - 'bindings/python/uv.lock'
      - 'bindings/js/package.json'
      - 'bindings/js/package-lock.json'
      - 'bindings/dotnet/Fatoora.csproj'
      - 'bindings/kotlin/build.gradle.kts'
      - 'scripts/check_release.py'
      - '.cargo/**'
      - 'rust-toolchain*'
      - 'fatoora-core/**'
      - 'fatoora-derive/**'
      - 'fatoora-ffi/**'
      - 'LICENSE-*'
      - 'THIRD_PARTY_NOTICES.md'
      - 'fatoora-cli/**'
      - 'bindings/c/**'
      - 'bindings/cpp/**'
      - 'scripts/package_c_api.py'
      - 'scripts/check_native_packages.py'
      - 'scripts/check_xml_free_artifacts.py'
      - 'README.md'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release to (e.g. v0.2.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"

jobs:
  release-cli:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'remove-libxml-v2')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            lib_ext: so
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            lib_ext: dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            lib_ext: dll

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check release metadata
        run: python scripts/check_release.py
      - name: Check publication tag
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: python scripts/check_release.py --tag "$RELEASE_TAG"

      - name: Install Rust
        run: rustup update stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: Build CLI
        run: cargo build -p fatoora-cli --release --locked --target ${{ matrix.target }}

      - name: Package CLI (unix)
        if: runner.os != 'Windows'
        run: |
          pkg=fatoora-cli-${{ matrix.target }}
          mkdir -p dist package/$pkg/licenses/zatca
          cp target/${{ matrix.target }}/release/fatoora package/$pkg/
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md package/$pkg/
          cp fatoora-core/tests/fixtures/business-rules/{LICENSE-LGPL-3.0.txt,LICENSE-GPL-3.0.txt,NOTICE.md} package/$pkg/licenses/zatca/
          tar -czf dist/${pkg}.tar.gz -C package/$pkg .

      - name: Package CLI (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $pkg = "fatoora-cli-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "package/$pkg" | Out-Null
          Copy-Item target/${{ matrix.target }}/release/fatoora.exe "package/$pkg/"
          Copy-Item LICENSE-MIT, LICENSE-APACHE, THIRD_PARTY_NOTICES.md "package/$pkg/"
          New-Item -ItemType Directory -Force -Path "package/$pkg/licenses/zatca" | Out-Null
          Copy-Item fatoora-core/tests/fixtures/business-rules/LICENSE-LGPL-3.0.txt, fatoora-core/tests/fixtures/business-rules/LICENSE-GPL-3.0.txt, fatoora-core/tests/fixtures/business-rules/NOTICE.md "package/$pkg/licenses/zatca/"
          & "./package/$pkg/fatoora.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Packaged CLI failed to start" }
          Compress-Archive -Path "package/$pkg/*" -DestinationPath "dist/$pkg.zip"

      - name: Verify native dependency closure
        run: python scripts/check_xml_free_artifacts.py dist

      - name: Verify packaged rule notices
        run: python scripts/check_native_packages.py dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-cli-${{ matrix.target }}
          path: dist/*

  release-ffi:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'remove-libxml-v2')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            lib_ext: so
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            lib_ext: dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            lib_ext: dll

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check release metadata
        run: python scripts/check_release.py
      - name: Check publication tag
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: python scripts/check_release.py --tag "$RELEASE_TAG"

      - name: Install Rust
        run: rustup update stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: Build FFI
        run: cargo build -p fatoora-ffi --release --locked --target ${{ matrix.target }}

      - name: Package FFI (unix)
        if: runner.os != 'Windows'
        run: |
          pkg=fatoora-ffi-${{ matrix.target }}
          mkdir -p dist package/$pkg/include package/$pkg/licenses/zatca
          cp target/${{ matrix.target }}/release/libfatoora_ffi.${{ matrix.lib_ext }} package/$pkg/
          python scripts/package_c_api.py package/$pkg
          cp -R bindings/cpp package/$pkg/include/diplomat-cpp
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md package/$pkg/
          cp fatoora-core/tests/fixtures/business-rules/{LICENSE-LGPL-3.0.txt,LICENSE-GPL-3.0.txt,NOTICE.md} package/$pkg/licenses/zatca/
          cp README.md package/$pkg/README.md
          tar -czf dist/${pkg}.tar.gz -C package/$pkg .

      - name: Package FFI (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = "fatoora-ffi-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path "package\\$pkg\\include" | Out-Null
          Copy-Item "target\\${{ matrix.target }}\\release\\fatoora_ffi.dll" "package\\$pkg\\"
          if (Test-Path "target\\${{ matrix.target }}\\release\\fatoora_ffi.dll.lib") {
            Copy-Item "target\\${{ matrix.target }}\\release\\fatoora_ffi.dll.lib" "package\\$pkg\\"
          } elseif (Test-Path "target\\${{ matrix.target }}\\release\\fatoora_ffi.lib") {
            Copy-Item "target\\${{ matrix.target }}\\release\\fatoora_ffi.lib" "package\\$pkg\\"
          }
          python scripts/package_c_api.py "package/$pkg"
          if ($LASTEXITCODE -ne 0) { throw "C API packaging failed" }
          Copy-Item -Recurse "bindings\\cpp" "package\\$pkg\\include\\diplomat-cpp"
          Copy-Item "LICENSE-MIT", "LICENSE-APACHE", "THIRD_PARTY_NOTICES.md" "package\\$pkg\\"
          Copy-Item "README.md" "package\\$pkg\\README.md"
          New-Item -ItemType Directory -Force -Path "package/$pkg/licenses/zatca" | Out-Null
          Copy-Item fatoora-core/tests/fixtures/business-rules/LICENSE-LGPL-3.0.txt, fatoora-core/tests/fixtures/business-rules/LICENSE-GPL-3.0.txt, fatoora-core/tests/fixtures/business-rules/NOTICE.md "package/$pkg/licenses/zatca/"
          python -c "import ctypes; lib = ctypes.CDLL(r'package/$pkg/fatoora_ffi.dll'); assert lib.fatoora_Config_new"
          if ($LASTEXITCODE -ne 0) { throw "Packaged FFI failed to load" }
          Compress-Archive -Path "package/$pkg/*" -DestinationPath "dist/$pkg.zip"

      - name: Verify native dependency closure
        run: python scripts/check_xml_free_artifacts.py dist

      - name: Verify packaged rule notices
        run: python scripts/check_native_packages.py dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-ffi-${{ matrix.target }}
          path: dist/*


  publish-assets:
    needs: [release-cli, release-ffi]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: dist/*
