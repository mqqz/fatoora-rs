name: release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release to (e.g. v0.2.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"

jobs:
  release-cli:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            lib_ext: so
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            lib_ext: dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            lib_ext: dll

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check release metadata
        run: python scripts/check_release.py
      - name: Check publication tag
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: python scripts/check_release.py --tag "$RELEASE_TAG"

      - name: Install Rust
        run: rustup update stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: Install libxml2 (vcpkg)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
          VCPKG_INSTALLATION_ROOT: C:\vcpkg
          VCPKG_BUILD_TYPE: release
        run: |
          if (-not (Test-Path $env:VCPKG_INSTALLATION_ROOT)) { throw "VCPKG_INSTALLATION_ROOT is not set on this runner." }
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_INSTALLATION_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_TRIPLET=x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKGRS_TRIPLET=x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_BUILD_TYPE=release" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $env:VCPKG_INSTALLATION_ROOT\vcpkg.exe install libxml2:x64-windows --triplet x64-windows --vcpkg-root $env:VCPKG_INSTALLATION_ROOT
      
      - name: Verify libxml2 install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $inc = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows\include\libxml2\libxml\parser.h"
          $lib = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows\lib\libxml2.lib"
          if (-not (Test-Path $inc)) { throw "Missing libxml2 header: $inc" }
          if (-not (Test-Path $lib)) { throw "Missing libxml2 import library: $lib" }

      - name: Build CLI
        env:
          VCPKG_ROOT: ${{ runner.os == 'Windows' && 'C:\\vcpkg' || '' }}
          VCPKG_INSTALLATION_ROOT: ${{ runner.os == 'Windows' && 'C:\\vcpkg' || '' }}
          VCPKG_DEFAULT_TRIPLET: ${{ runner.os == 'Windows' && 'x64-windows' || '' }}
          VCPKGRS_TRIPLET: ${{ runner.os == 'Windows' && 'x64-windows' || '' }}
          VCPKG_BUILD_TYPE: ${{ runner.os == 'Windows' && 'release' || '' }}
          VCPKG_LIBXML2_INCLUDE: ${{ runner.os == 'Windows' && 'C:\\vcpkg\\installed\\x64-windows\\include' || '' }}
          VCPKG_LIBXML2_LIB: ${{ runner.os == 'Windows' && 'C:\\vcpkg\\installed\\x64-windows\\lib' || '' }}
          VCPKGRS_DYNAMIC: "1"
        run: cargo build -p fatoora-rs-cli --release --locked --target ${{ matrix.target }}

      - name: Package CLI (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/fatoora-rs-cli dist/fatoora-rs-cli-${{ matrix.target }}
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md dist/
          fi

      - name: Package CLI (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $pkg = "fatoora-rs-cli-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "package/$pkg" | Out-Null
          Copy-Item target/${{ matrix.target }}/release/fatoora-rs-cli.exe "package/$pkg/"
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll" "package/$pkg/"
          Copy-Item LICENSE-MIT, LICENSE-APACHE, THIRD_PARTY_NOTICES.md "package/$pkg/"
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/share" "package/$pkg/licenses" -Recurse
          & "./package/$pkg/fatoora-rs-cli.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Packaged CLI failed to start" }
          Compress-Archive -Path "package/$pkg/*" -DestinationPath "dist/$pkg.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-cli-${{ matrix.target }}
          path: dist/*

  release-ffi:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            lib_ext: so
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            lib_ext: dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            lib_ext: dll

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check release metadata
        run: python scripts/check_release.py
      - name: Check publication tag
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: python scripts/check_release.py --tag "$RELEASE_TAG"

      - name: Install Rust
        run: rustup update stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: Install libxml2 (vcpkg)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
          VCPKG_INSTALLATION_ROOT: C:\vcpkg
          VCPKG_BUILD_TYPE: release
        run: |
          if (-not (Test-Path $env:VCPKG_INSTALLATION_ROOT)) { throw "VCPKG_INSTALLATION_ROOT is not set on this runner." }
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_INSTALLATION_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_TRIPLET=x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKGRS_TRIPLET=x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_BUILD_TYPE=release" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $env:VCPKG_INSTALLATION_ROOT\vcpkg.exe install libxml2:x64-windows --triplet x64-windows --vcpkg-root $env:VCPKG_INSTALLATION_ROOT
      
      - name: Verify libxml2 install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $inc = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows\include\libxml2\libxml\parser.h"
          $lib = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows\lib\libxml2.lib"
          if (-not (Test-Path $inc)) { throw "Missing libxml2 header: $inc" }
          if (-not (Test-Path $lib)) { throw "Missing libxml2 import library: $lib" }

      - name: Build FFI
        env:
          VCPKG_ROOT: ${{ runner.os == 'Windows' && 'C:\\vcpkg' || '' }}
          VCPKG_INSTALLATION_ROOT: ${{ runner.os == 'Windows' && 'C:\\vcpkg' || '' }}
          VCPKG_DEFAULT_TRIPLET: ${{ runner.os == 'Windows' && 'x64-windows' || '' }}
          VCPKGRS_TRIPLET: ${{ runner.os == 'Windows' && 'x64-windows' || '' }}
          VCPKG_BUILD_TYPE: ${{ runner.os == 'Windows' && 'release' || '' }}
          VCPKG_LIBXML2_INCLUDE: ${{ runner.os == 'Windows' && 'C:\\vcpkg\\installed\\x64-windows\\include' || '' }}
          VCPKG_LIBXML2_LIB: ${{ runner.os == 'Windows' && 'C:\\vcpkg\\installed\\x64-windows\\lib' || '' }}
          VCPKGRS_DYNAMIC: "1"
        run: cargo build -p fatoora-ffi --release --locked --target ${{ matrix.target }}

      - name: Package FFI (unix)
        if: runner.os != 'Windows'
        run: |
          pkg=fatoora-ffi-${{ matrix.target }}
          mkdir -p dist package/$pkg/include
          cp target/${{ matrix.target }}/release/libfatoora_ffi.${{ matrix.lib_ext }} package/$pkg/
          cp fatoora-ffi/include/fatoora_ffi.h package/$pkg/include/
          cp fatoora-ffi/include/fatoora.h package/$pkg/include/
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md package/$pkg/
          cp README.md package/$pkg/README.md
          tar -czf dist/${pkg}.tar.gz -C package/$pkg .

      - name: Package FFI (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = "fatoora-ffi-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path "package\\$pkg\\include" | Out-Null
          Copy-Item "target\\${{ matrix.target }}\\release\\fatoora_ffi.dll" "package\\$pkg\\"
          if (Test-Path "target\\${{ matrix.target }}\\release\\fatoora_ffi.dll.lib") {
            Copy-Item "target\\${{ matrix.target }}\\release\\fatoora_ffi.dll.lib" "package\\$pkg\\"
          } elseif (Test-Path "target\\${{ matrix.target }}\\release\\fatoora_ffi.lib") {
            Copy-Item "target\\${{ matrix.target }}\\release\\fatoora_ffi.lib" "package\\$pkg\\"
          }
          Copy-Item "fatoora-ffi\\include\\fatoora_ffi.h" "package\\$pkg\\include\\"
          Copy-Item "fatoora-ffi\\include\\fatoora.h" "package\\$pkg\\include\\"
          Copy-Item "LICENSE-MIT", "LICENSE-APACHE", "THIRD_PARTY_NOTICES.md" "package\\$pkg\\"
          Copy-Item "README.md" "package\\$pkg\\README.md"
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll" "package/$pkg/"
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/share" "package/$pkg/licenses" -Recurse
          python -c "import ctypes; lib = ctypes.CDLL(r'package/$pkg/fatoora_ffi.dll'); assert lib.fatoora_config_new"
          if ($LASTEXITCODE -ne 0) { throw "Packaged FFI failed to load" }
          Compress-Archive -Path "package/$pkg/*" -DestinationPath "dist/$pkg.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-ffi-${{ matrix.target }}
          path: dist/*


  publish-assets:
    needs: [release-cli, release-ffi]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: dist/*
