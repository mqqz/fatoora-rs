name: kotlin
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to Maven Central (select an existing release tag)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: kotlin-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        id: diplomat-kotlin
        with:
          path: .tools/diplomat-kotlin
          key: diplomat-kotlin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install_kotlin_generator.py', 'scripts/patches/diplomat-kotlin.patch') }}
      - if: steps.diplomat-kotlin.outputs.cache-hit != 'true'
        run: python3 scripts/install_kotlin_generator.py
      - run: python3 scripts/generate_kotlin.py --check
      - run: python3 scripts/check_release.py
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            container: quay.io/pypa/manylinux_2_28_x86_64@sha256:4131ddd7acb9c6c966af02fe7e71edc51e078c2d41f475966697676430bfa2ae
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        run: echo /opt/python/cp312-cp312/bin >> "$GITHUB_PATH"
      - uses: actions/setup-python@v7
        if: runner.os != 'Linux'
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '8'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: kotlin-${{ matrix.container || matrix.os }}
      - run: python scripts/build_kotlin.py --stage-dir dist/kotlin-native
      - if: runner.os == 'Linux'
        run: python scripts/check_dotnet_linux.py dist/kotlin-native/linux-x86-64/libfatoora_ffi.so
      - name: Kotlin and Java contracts on Java 8
        shell: bash
        run: bindings/kotlin/gradlew -p bindings/kotlin --no-daemon test -PtestJava=8 -PnativeDir="$GITHUB_WORKSPACE/target/jvm-release"
      - name: Isolated Maven consumer
        run: python scripts/check_kotlin.py
      - uses: actions/upload-artifact@v4
        with:
          name: kotlin-native-${{ matrix.os }}
          path: dist/kotlin-native
          if-no-files-found: error
  package:
    needs: desktop
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: kotlin-native-*
          path: dist/kotlin-native
          merge-multiple: true
      - run: python scripts/build_kotlin.py --native-root dist/kotlin-native
      - run: python scripts/check_kotlin.py
      - uses: actions/upload-artifact@v4
        with:
          name: kotlin-maven
          path: bindings/kotlin/build/repository
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "ndk;28.2.13676358" "platforms;android-35" "build-tools;35.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: kotlin-android
      - run: python scripts/build_kotlin.py --android --ndk "$ANDROID_HOME/ndk/28.2.13676358"
      - uses: actions/upload-artifact@v4
        with:
          name: kotlin-android
          path: |
            bindings/kotlin/android/build/outputs/aar/*release.aar
            bindings/kotlin/android/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: kotlin-android-maven
          path: bindings/kotlin/build/repository
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: kotlin-android-consumer
          path: bindings/kotlin/android-consumer/build/outputs/apk
          if-no-files-found: error
  android-test:
    needs: android
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            target: google_apis
            page-size: 4096
          - api: 35
            target: google_apis_ps16k
            page-size: 16384
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: kotlin-android
          path: dist/android
      - uses: actions/download-artifact@v4
        with:
          name: kotlin-android-consumer
          path: dist/android-consumer
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          # The API 35 16 KiB image exhausts the emulator's default 2560 MiB.
          ram-size: 4096M
          disable-animations: true
          script: |
            adb shell cat /proc/meminfo
            if [ '${{ matrix.page-size }}' = '16384' ]; then test "$(adb shell getconf PAGE_SIZE | tr -d '\r')" = '16384'; fi
            adb install dist/android/apk/androidTest/debug/android-debug-androidTest.apk
            adb shell am instrument -w com.fatoora.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
            if ! grep -Eq 'OK \([0-9]+ tests?\)' instrumentation.txt; then adb logcat -d -b crash; adb logcat -d -t 200; exit 1; fi
            adb install dist/android-consumer/debug/android-consumer-debug.apk
            adb install dist/android-consumer/androidTest/debug/android-consumer-debug-androidTest.apk
            adb shell am instrument -w com.fatoora.consumer.test/androidx.test.runner.AndroidJUnitRunner | tee consumer.txt
            if ! grep -Eq 'OK \([0-9]+ tests?\)' consumer.txt; then adb logcat -d -b crash; adb logcat -d -t 200; exit 1; fi

  central-bundle:
    needs: [generator, package, android-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: kotlin-maven
          path: dist/maven
      - uses: actions/download-artifact@v4
        with:
          name: kotlin-android-maven
          path: dist/maven
      - run: python3 -m unittest discover -s scripts/tests -p test_publish_kotlin.py -v
      - name: Validate Central artifacts without credentials
        run: python3 scripts/publish_kotlin.py --repository dist/maven
      - uses: actions/upload-artifact@v4
        with:
          name: kotlin-central-repository
          path: dist/maven
          if-no-files-found: error
  publish:
    needs: central-bundle
    if: |
      github.repository == 'mqqz/fatoority' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: maven-central-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: kotlin-central-repository
          path: dist/maven
      - name: Check release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$RELEASE_REF_TYPE" = tag
          python3 scripts/check_release.py --tag "$RELEASE_TAG"
      - name: Sign and publish tested artifacts
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: python3 scripts/publish_kotlin.py --repository dist/maven --sign --publish
      - name: Retain deployment ID for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-central-deployment
          path: dist/central/*.deployment.json
          if-no-files-found: ignore
