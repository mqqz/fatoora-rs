site_name: fatoority
site_description: Build Saudi e-invoicing integrations with fatoority. Sign invoices, validate XML, generate QR payloads, and connect to ZATCA APIs.
site_url: https://docs.fatoority.com/
repo_name: mqqz/fatoority
repo_url: https://github.com/mqqz/fatoority

theme:
  name: material
  custom_dir: docs/overrides
  features:
    - content.tabs.link
    - content.code.copy
  logo: assets/images/crab-logo.png
  palette:
    scheme: slate
  font:
    text: Inter

nav:
  - Home: index.md
  - Guides:
      - CSR Generation: guides/csr.md
      - Invoice Signing: guides/invoice-signing.md
      - Validation: guides/validation.md
      - QR Codes: guides/qr.md
      - ZATCA API Client: guides/api.md
      - CLI: guides/cli.md
  - Reference:
      - Configuration: reference/configuration.md
      - CSR: reference/csr.md
      - Bindings:
          - Python: reference/bindings/python.md
          - JavaScript / TypeScript: reference/bindings/javascript.md
          - C# / .NET: reference/bindings/csharp.md
          - Kotlin / Java: reference/bindings/kotlin.md
          - C/C++ (FFI): reference/bindings/c.md
      - Invoice:
          - Model: reference/invoice-model.md
          - Decimal numbers: reference/numbers.md
          - Signing: reference/invoice-signing.md
          - Validation: reference/invoice-validation.md
          - XML: reference/xml.md
          - XML and Schemas: reference/xml-and-schemas.md
          - QR: reference/qr.md
      - API Client: reference/api-client.md
      - Errors: reference/errors.md
      - SDK Compatibility: development/sdk-parity.md
  - Contributing:
      - Getting Started: contributing.md
      - Binding Development: development/diplomat.md
      - Validation Tests: development/business-rules.md
      - Releases: development/releases.md
  - Benchmarks: benchmarks.md
  - Security: security.md

extra_css:
  - assets/stylesheets/home.css

plugins:
  - search
  - macros:
      include_yaml:
        - docs/_vars.yml

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
