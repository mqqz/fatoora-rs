site_name: fatoora-rs
site_description: Unofficial toolkit for ZATCA Phase 1/2 compliant e-invoicing
site_url: https://rs.fatoority.com
repo_name: mqqz/fatoora-rs
repo_url: https://github.com/mqqz/fatoora-rs

theme:
  name: material
  features:
    - content.tabs.link
  logo: assets/images/crab-logo.png
  palette:
    scheme: slate
  font:
    text: Inter

nav:
  - Home: index.md
  - Guides:
      - CSR Generation: guides/csr.md
      - Invoice Signing: guides/invoice-signing.md
      - Validation: guides/validation.md
      - QR Codes: guides/qr.md
      - ZATCA API Client: guides/api.md
      - CLI: guides/cli.md
  - Reference:
      - Configuration: reference/configuration.md
      - CSR: reference/csr.md
      - Bindings:
          - Python: reference/bindings/python.md
          - C/C++ (FFI): reference/bindings/c.md
      - Invoice:
          - Model: reference/invoice-model.md
          - Signing: reference/invoice-signing.md
          - Validation: reference/invoice-validation.md
          - XML: reference/xml.md
          - XML and Schemas: reference/xml-and-schemas.md
          - QR: reference/qr.md
      - API Client: reference/api-client.md
      - Errors: reference/errors.md
  - Development:
      - Overview: development/index.md
      - API Audit: development/api-audit.md
      - FFI Workflow: development/ffi-workflow.md
      - FFI Parity Workflow: development/ffi-parity.md
      - API Parity Matrix: development/api-parity.md
  - Benchmarks: benchmarks.md
  - Contributing: contributing.md
  - Security: security.md

plugins:
  - search
  - macros:
      include_yaml:
        - docs/_vars.yml

markdown_extensions:
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
