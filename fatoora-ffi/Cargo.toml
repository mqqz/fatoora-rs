[package]
name = "fatoora-ffi"
version = "0.4.2"
edition = "2024"
description = "C ABI bindings for the fatoora ZATCA SDK"
license = "MIT OR Apache-2.0"
authors = ["mqqz"]
homepage = "https://github.com/mqqz/fatoority"
repository = "https://github.com/mqqz/fatoority"
readme = "../README.md"
keywords = ["zatca", "ffi", "c-abi"]
categories = ["api-bindings", "external-ffi-bindings"]

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1.0.145"
diplomat = "=0.16.1"
diplomat-runtime = "=0.16.0"
fatoora-core = { path = "../fatoora-core", version = "0.4.2" }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.47.1", features = ["rt", "rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = "0.4"

[dev-dependencies]
k256 = { version = "0.14.0", features = ["pkcs8", "pem"] }
x509-cert = { version = "0.3.0", features = ["builder", "pem"] }
httpmock = "0.7.0"
base64ct = "1.8.0"
