[package]
name = "fatoora-cli"
version = "0.4.0"
edition = "2024"
description = "Command-line interface for the fatoora ZATCA SDK"
license = "MIT OR Apache-2.0"
authors = ["mqqz"]
homepage = "https://github.com/mqqz/fatoority"
documentation = "https://docs.rs/fatoora-cli"
repository = "https://github.com/mqqz/fatoority"
readme = "../README.md"
keywords = ["zatca", "e-invoice", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "fatoora"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
fatoora-core = { version = "0.4.0", path = "../fatoora-core" }
base64ct = "1.8.0"
serde_json = "1.0.143"
