[package]
name = "fatoora-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
base64ct = "1.8"
fatoora-core = { path = "../fatoora-core" }

[workspace]
members = ["."]

[[bin]]
name = "xml_parse"
path = "fuzz_targets/xml_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "qr_decode"
path = "fuzz_targets/qr_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signing_inputs"
path = "fuzz_targets/signing_inputs.rs"
test = false
doc = false
bench = false
