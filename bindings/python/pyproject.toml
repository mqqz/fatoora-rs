[build-system]
requires = ["setuptools>=77.0.3", "wheel", "nanobind==2.12.0", "cmake>=3.19"]
build-backend = "setuptools.build_meta"

[project]
name = "fatoority"
version = "0.4.0"
description = "Python bindings for the fatoority library, providing ZATCA-compliant e-invoicing functionality."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "mqqz" }]
dependencies = []
keywords = ["zatca", "invoice", "e-invoicing", "sdk", "ffi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://docs.fatoority.com"
Repository = "https://github.com/mqqz/fatoority"
Documentation = "https://docs.fatoority.com"
Issues = "https://github.com/mqqz/fatoority/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["fatoora"]

[tool.setuptools.package-data]
fatoora = ["*.so", "*.dylib", "*.dll", "*.h", "licenses/*/*"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_*"
test-command = "python {project}/tests/wheel_smoke.py"

[tool.cibuildwheel.linux]
before-all = "yum -y install glibc-headers glibc-devel gcc gcc-c++ kernel-headers libstdc++-devel && curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
environment = "CARGO_HOME=/root/.cargo PATH=/root/.cargo/bin:$PATH"
before-build = "cargo build -p fatoora-ffi --release --locked --manifest-path _cargo_ws/Cargo.toml"

[tool.cibuildwheel.macos]
before-build = "cargo build -p fatoora-ffi --release --locked --manifest-path _cargo_ws/Cargo.toml"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
# Preserve the bundled FFI DLL while repairing its dependency imports.
repair-wheel-command = "delvewheel repair --ignore-existing --analyze-existing --with-mangle -w {dest_dir} {wheel}"
before-build = "cargo build -p fatoora-ffi --release --locked --manifest-path _cargo_ws/Cargo.toml"

[tool.ruff.lint.per-file-ignores]
# Ignore E402 (module level import not at top of file) in examples
"examples/*" = ["E402"]
