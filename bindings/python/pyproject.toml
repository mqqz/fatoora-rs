[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fatoora-rs"
version = "0.1.2"
description = "Python bindings for the fatoora-rs ZATCA SDK"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "mqqz" }]
dependencies = ["cffi>=1.16"]
keywords = ["zatca", "invoice", "e-invoicing", "sdk", "ffi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/mqqz/fatoora-rs"
Repository = "https://github.com/mqqz/fatoora-rs"
Documentation = "https://github.com/mqqz/fatoora-rs"
Issues = "https://github.com/mqqz/fatoora-rs/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["fatoora"]

[tool.setuptools.package-data]
fatoora = ["*.so", "*.dylib", "*.dll"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_*"
test-command = "python -c \"import fatoora; print(fatoora.__all__)\""

[tool.cibuildwheel.linux]
before-all = "yum -y install libxml2-devel pkgconfig clang clang-libs llvm-devel glibc-headers glibc-devel gcc gcc-c++ kernel-headers libstdc++-devel && curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
environment = "CARGO_HOME=/root/.cargo PATH=/root/.cargo/bin:$PATH PKG_CONFIG_PATH=/usr/lib64/pkgconfig:/usr/local/lib/pkgconfig LIBCLANG_PATH=/usr/lib64 BINDGEN_EXTRA_CLANG_ARGS=--sysroot=/usr"
before-build = "cargo build -p fatoora-ffi --release --manifest-path _cargo_ws/Cargo.toml"

[tool.cibuildwheel.macos]
before-build = "cargo build -p fatoora-ffi --release --manifest-path _cargo_ws/Cargo.toml"

[tool.cibuildwheel.windows]
before-all = "powershell -Command \"if (!(Test-Path $env:VCPKG_INSTALLATION_ROOT)) { Write-Error 'VCPKG_INSTALLATION_ROOT is not set on this runner.'; exit 1 }; & $env:VCPKG_INSTALLATION_ROOT\\\\vcpkg.exe install libxml2:x64-windows --x-buildtype=release; if (!(Test-Path 'C:\\\\Program Files\\\\LLVM\\\\bin\\\\libclang.dll')) { Write-Error 'libclang.dll not found at C:\\\\Program Files\\\\LLVM\\\\bin. Install LLVM on the runner or set LIBCLANG_PATH.'; exit 1 }\""
environment = "VCPKG_ROOT=C:\\\\vcpkg VCPKG_DEFAULT_TRIPLET=x64-windows VCPKGRS_DYNAMIC=1 LIBCLANG_PATH=C:\\\\PROGRA~1\\\\LLVM\\\\bin VCPKG_BUILD_TYPE=release VCPKG_LIBXML2_INCLUDE=C:\\\\vcpkg\\\\installed\\\\x64-windows\\\\include VCPKG_LIBXML2_LIB=C:\\\\vcpkg\\\\installed\\\\x64-windows\\\\lib"
before-build = "powershell -Command \"C:\\\\vcpkg\\\\vcpkg.exe list | Select-String libxml2\" && cargo build -p fatoora-ffi --release --manifest-path _cargo_ws/Cargo.toml"

[tool.ruff.lint.per-file-ignores]
# Ignore E402 (module level import not at top of file) in examples
"examples/*" = ["E402"]
