[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fatoora-rs"
version = "0.2.0"
description = "Python bindings for the fatoora-rs library, providing ZATCA-compliant e-invoicing functionality."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "mqqz" }]
dependencies = ["cffi>=1.16"]
keywords = ["zatca", "invoice", "e-invoicing", "sdk", "ffi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://rs.fatoority.com"
Repository = "https://github.com/mqqz/fatoora-rs"
Documentation = "https://rs.fatoority.com"
Issues = "https://github.com/mqqz/fatoora-rs/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["fatoora"]

[tool.setuptools.package-data]
fatoora = ["*.so", "*.dylib", "*.dll"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_*"
test-command = "python -c \"import fatoora; print(fatoora.__all__)\""

[tool.cibuildwheel.linux]
before-all = "yum -y install glibc-headers glibc-devel gcc gcc-c++ kernel-headers libstdc++-devel && curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
environment = "CARGO_HOME=/root/.cargo PATH=/root/.cargo/bin:$PATH"
before-build = "cargo build -p fatoora-ffi --release --manifest-path _cargo_ws/Cargo.toml"

[tool.cibuildwheel.macos]
before-build = "cargo build -p fatoora-ffi --release --manifest-path _cargo_ws/Cargo.toml"

[tool.cibuildwheel.windows]
before-build = "cargo build -p fatoora-ffi --release --manifest-path _cargo_ws/Cargo.toml"

[tool.ruff.lint.per-file-ignores]
# Ignore E402 (module level import not at top of file) in examples
"examples/*" = ["E402"]
