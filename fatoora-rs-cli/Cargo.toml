[package]
name = "fatoora-rs-cli"
version = "0.1.2"
edition = "2024"
description = "Command-line interface for the fatoora ZATCA SDK"
license = "MIT"
authors = ["mqqz"]
homepage = "https://github.com/mqqz/fatoora-rs"
documentation = "https://docs.rs/fatoora-rs-cli"
repository = "https://github.com/mqqz/fatoora-rs"
readme = "../README.md"
keywords = ["zatca", "e-invoice", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
fatoora-core = { version = "0.1.2", path = "../fatoora-core" }
base64ct = "1.8.0"
serde_json = "1.0.143"

[profile.release]
codegen-units = 1
lto = true 
