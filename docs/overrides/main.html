{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  {% if page %}
    {% set title = (page.meta.title or page.title) ~ ' - ' ~ config.site_name %}
    {% set description = page.meta.description or config.site_description %}
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ config.site_name | e }}">
    <meta property="og:title" content="{{ title | e }}">
    <meta property="og:description" content="{{ description | e }}">
    <meta property="og:url" content="{{ page.canonical_url | e }}">
    <meta property="og:image" content="{{ config.site_url }}assets/images/crab-logo.png">
    <meta property="og:image:alt" content="fatoority crab logo">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ title | e }}">
    <meta name="twitter:description" content="{{ description | e }}">
    <meta name="twitter:image" content="{{ config.site_url }}assets/images/crab-logo.png">
    <meta name="twitter:image:alt" content="fatoority crab logo">
  {% endif %}
{% endblock %}
