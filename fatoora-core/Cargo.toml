[package]
name = "fatoora-core"
version = "0.4.4"
edition = "2024"
description = "Rust Fatoora/ZATCA SDK with C ABI and multi-language bindings"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mqqz/fatoority"
readme = "../README.md"
authors = ["mqqz"]
homepage = "https://github.com/mqqz/fatoority"
documentation = "https://docs.rs/fatoora-core"
keywords = ["zatca", "e-invoice", "invoice", "ubl", "saudi"]
categories = ["api-bindings", "cryptography", "parser-implementations"]

[lints]
workspace = true

[dependencies]
java-properties = "2.0.0"
encoding_rs = "0.8.35"
quick-xml = { version = "0.39.0", features = ["serialize"] }
serde = "1.0.228"
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
fatoora-derive = { version = "0.4.4", path = "../fatoora-derive" }
x509-cert = { version = "0.3.0", features = ["builder", "pem"] }
k256 = { version = "0.14.0", features = [
    "ecdsa",
    "ecdsa-core",
    "sha256",
    "getrandom",
    "pkcs8",
    "pem",
] }
const-oid = { version = "0.10.1", features = ["db"] }
ecdsa = { version = "0.17.0", features = [
    "algorithm",
    "alloc",
    "digest",
    "pkcs8",
    "sha2",
] }
base64ct = "1.8.0"
# Digest-critical: upgrade only after canonical-byte corpus verification.
xml-sec = { version = "=0.1.20", default-features = false, features = ["std", "c14n", "xml-backend-roxmltree"] }
xsd-schema = { version = "=0.2.2", default-features = false }
# Original byte ranges are part of the XML editing contract.
roxmltree = { version = "0.21.1", features = ["positions"] }
isocountry = "0.3.2"
chrono = { version = "0.4.42", default-features = false, features = ["std", "serde"] }
iso_currency = { version = "0.5.3", features = ["with-serde"] }
http = "1"
bitflags = { version = "2.10.0", features = ["serde"] }
rust_decimal = { version = "1.40", default-features = false, features = ["std"] }
num-bigint = "0.4.6"
num-traits = "0.2.19"
regex = "1.12.2"
fancy-regex = "0.16.2"
unicode-blocks = "0.1.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
reqwest = { version = "0.13.5", features = ["json"] }

# Android uses bundled Mozilla roots without JVM initialization in Rust TLS.
[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "http2", "charset", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"] }

[build-dependencies]
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"] }

[dev-dependencies]
tempfile = "3.23.0"
ron = "0.8.1"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
httpmock = "0.7.0"
trybuild = "1"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
